[project]
name = "complex-program"
version = "0.1.0"
description = "ЛР2 (SIFT/ORB) + ЛР3 (Tesseract OCR) на Flet + OpenCV"
readme = "README.md"
# numpy 2.4.6 и pillow 13.0.0 требуют Python >= 3.11
requires-python = ">=3.11"
dependencies = [
    "flet==1.0.5",
    "flet-desktop==1.0.5",
    "numpy==2.4.6",
    "opencv-contrib-python==5.0.0.93",
    "pillow==13.0.0",
    "pytesseract==0.3.13",
    "pyautogui==0.9.54",
]
