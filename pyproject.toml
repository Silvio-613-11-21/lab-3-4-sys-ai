[project]
name = "sii-lab2-lab3"
version = "1.0.0"
description = "ЛР2 (SIFT/ORB поиск объекта) + ЛР3 (контурный анализ и Tesseract OCR) на Flet + OpenCV"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }

dependencies = [
    "flet==1.0.5",
    "flet-desktop==1.0.5",
    "opencv-contrib-python==5.0.0.93",
    "numpy==2.4.6",
    "pillow==13.0.0",
    "pytesseract==0.3.13",
    "mss==10.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
